<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Desk sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}
a{color:#2448C8}a:hover{color:#1A3596}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Inter, system-ui, sans-serif; color: #1C1C1A; background: #F6F5F1; font-size: 14px; line-height: 1.45">

<nav aria-label="Main" style="flex: 1 1 232px; box-sizing: border-box; padding: 24px 16px; background: #FFFFFF; border-right: 1px solid #E4E2DA; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M8 11l3 3 5-6"></path></svg>
<span style="font-weight: 700; font-size: 16px">Agent Desk</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #1C1C1A; text-decoration: none">
<span>Decisions</span>
<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #2448C8; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">4</span>
</a>
<a href="Sessions.dc.html" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #EEF1FB; color: #1A3596; font-weight: 600; text-decoration: none">Sessions</a>
<a href="Accounts.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #1C1C1A; text-decoration: none">Accounts</a>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 12px; border: 1px solid #E4E2DA; border-radius: 10px">
<div style="font-size: 12px; font-weight: 600; color: #5E5E58; text-transform: uppercase; letter-spacing: 0.04em">Weekly usage</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span>Account A</span><span style="color: #A32020; font-weight: 600">Limit hit</span></div>
<div style="height: 6px; border-radius: 3px; background: #ECEAE3"><div style="width: 100%; height: 6px; border-radius: 3px; background: #A32020"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span>Account B</span><span style="color: #1F6B3A; font-weight: 600">Active · 38%</span></div>
<div style="height: 6px; border-radius: 3px; background: #ECEAE3"><div style="width: 38%; height: 6px; border-radius: 3px; background: #1F6B3A"></div></div>
</div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Sessions</h1>
<p style="margin: 0; color: #5E5E58">8 sessions on the box · 3 working · 3 waiting on you</p>
</div>
<button type="button" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #2448C8; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">New session</button>
</header>

<div role="group" aria-label="Filter sessions" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 18px; background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 10px">
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; color: #1C1C1A; text-decoration: none">{{r.name}}</a>
<span style="font-size: 12px; color: #5E5E58">{{r.repo}}</span>
</div>
<div style="flex: 0 0 140px"><span style="{{r.statusStyle}}">{{r.status}}</span></div>
<div style="flex: 0 0 110px; font-size: 13px; color: #3D3D39">{{r.account}}</div>
<div style="flex: 999 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #3D3D39; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.last}}</span>
<sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #8A4B00">{{r.note}}</span></sc-if>
</div>
<div style="flex: 0 0 72px; font-size: 12px; color: #5E5E58; text-align: right">{{r.updated}}</div>
<sc-if value="{{r.canMove}}" hint-placeholder-val="{{false}}">
<button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid #CFCCC2; border-radius: 8px; background: #FFFFFF; color: #1C1C1A; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Move to Account B</button>
</sc-if>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
var SESSIONS = [
  { name: 'lego-content-type', repo: 'solis-v1 · feat/lego', status: 'Waiting on you', kind: 'waiting', account: 'Account B', last: 'Posted a decision: which 30s render ships', updated: '4 min' },
  { name: 'v1-influencer-pricing', repo: 'solis-v1 · fix/v1-pricing', status: 'Waiting on you', kind: 'waiting', account: 'Account B', last: 'Posted a decision: price when the brand pays', updated: '18 min' },
  { name: 'remove-hyro-tiles', repo: 'solis-v1 · chore/remove-hyro', status: 'Waiting on you', kind: 'waiting', account: 'Account A', last: 'Posted a decision: delete old tile files', updated: '42 min' },
  { name: 'orchestrator', repo: 'solis-v1 · main', status: 'Working', kind: 'working', account: 'Account B', last: 'Checking memory on the box', updated: 'now' },
  { name: 'shot-based-rendering', repo: 'solis-v1 · spike/shots', status: 'Working', kind: 'working', account: 'Account B', last: 'Round 2 voices: 3 of 6 renders done', updated: '1 min', note: 'Moved from Account A at 9:52 when it hit the limit' },
  { name: 'pixar-fresh', repo: 'solis-v1 · feat/pixar-fresh', status: 'Working', kind: 'working', account: 'Account B', last: 'pnpm vitest run convex/domain/content', updated: '2 min' },
  { name: 'tiktok-fail-reason', repo: 'solis-v1 · fix/tiktok-copy', status: 'Paused', kind: 'paused', account: 'Account A', last: 'Stopped: Account A weekly limit', updated: '31 min', note: 'Resumes Sun 9:00 on Account A, or move it now', canMove: true },
  { name: 'posts-index-limit', repo: 'solis-v1 · fix/posts-index', status: 'Idle', kind: 'idle', account: 'Account B', last: 'PR approved. Nothing left to do.', updated: '1 h' }
];

var CHIP = 'display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 10px; ';
var STATUS = {
  waiting: CHIP + 'background: #FDF0DC; color: #8A4B00',
  working: CHIP + 'background: #E6F4EA; color: #1F6B3A',
  paused: CHIP + 'background: #FBE7E7; color: #A32020',
  idle: CHIP + 'background: #F1EFE9; color: #5E5E58'
};
var FILTERS = [
  { id: 'all', label: 'All' },
  { id: 'waiting', label: 'Waiting on you' },
  { id: 'working', label: 'Working' },
  { id: 'paused', label: 'Paused' },
  { id: 'idle', label: 'Idle' }
];
var PILL = 'min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ';

class Component extends DCLogic {
  state = { filter: 'all' };

  renderVals() {
    var self = this;
    var f = this.state.filter;
    return {
      filters: FILTERS.map(function (x) {
        var on = x.id === f;
        return {
          label: x.label,
          on: on,
          style: PILL + (on ? 'background: #1C1C1A; color: #FFFFFF; border: 1px solid #1C1C1A' : 'background: #FFFFFF; color: #1C1C1A; border: 1px solid #CFCCC2'),
          pick: function () { self.setState({ filter: x.id }); }
        };
      }),
      rows: SESSIONS.filter(function (r) { return f === 'all' || r.kind === f; }).map(function (r) {
        return Object.assign({}, r, { statusStyle: STATUS[r.kind], hasNote: !!r.note, canMove: !!r.canMove });
      })
    };
  }
}
</script>
</body>
</html>
